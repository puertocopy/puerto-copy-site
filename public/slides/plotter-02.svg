<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07162C"/>
      <stop offset="55%" stop-color="#0B4B8A"/>
      <stop offset="100%" stop-color="#E8EEF7"/>
    </linearGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#B7D0F1" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="2000" height="1200" fill="url(#bg2)"/>
  <rect width="2000" height="1200" fill="url(#dots2)"/>

  <!-- Large format printer -->
  <g transform="translate(260 520)">
    <rect x="0" y="0" width="1480" height="280" rx="36" fill="#0A1C3A"/>
    <rect x="120" y="60" width="1240" height="80" rx="18" fill="#1E3E6C"/>
    <rect x="180" y="160" width="1120" height="50" rx="12" fill="#0F2A4F"/>
    <circle cx="260" cy="210" r="16" fill="#65C9FF"/>
    <circle cx="320" cy="210" r="16" fill="#FFD166"/>
    <circle cx="380" cy="210" r="16" fill="#74E1A0"/>
  </g>

  <!-- Paper coming out -->
  <g transform="translate(520 300)">
    <rect x="0" y="0" width="980" height="300" rx="24" fill="#F9FBFF"/>
    <rect x="60" y="60" width="860" height="180" rx="16" fill="#E6F0FF"/>
    <path d="M120 120H860M120 180H860" stroke="#AFC3E6" stroke-width="8"/>
    <rect x="160" y="90" width="200" height="120" rx="10" fill="none" stroke="#8FB8FF" stroke-width="6"/>
  </g>

  <!-- Blueprint roll -->
  <g transform="translate(1200 250)">
    <rect x="0" y="0" width="420" height="120" rx="18" fill="#EAF2FF"/>
    <rect x="30" y="20" width="360" height="80" rx="14" fill="#FFFFFF"/>
    <path d="M60 60H360" stroke="#B3C7E6" stroke-width="6"/>
  </g>
</svg>
