<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="60%" stop-color="#0B63B2"/>
      <stop offset="100%" stop-color="#F5F7FB"/>
    </linearGradient>
    <pattern id="grid1" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#B8D3F2" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="2000" height="1200" fill="url(#bg1)"/>
  <rect width="2000" height="1200" fill="url(#grid1)"/>

  <!-- Blueprint sheet -->
  <g transform="translate(220 140)">
    <rect x="0" y="0" width="820" height="520" rx="28" fill="#0E2A5A" opacity="0.85"/>
    <rect x="40" y="40" width="740" height="440" rx="20" fill="#133B7A"/>
    <path d="M90 120H730M90 220H730M90 320H730M90 420H730" stroke="#7FB3FF" stroke-width="4" opacity="0.45"/>
    <path d="M180 90V470M360 90V470M540 90V470" stroke="#7FB3FF" stroke-width="3" opacity="0.35"/>
    <rect x="120" y="140" width="160" height="120" rx="10" fill="none" stroke="#9AC5FF" stroke-width="4"/>
    <rect x="520" y="300" width="180" height="110" rx="10" fill="none" stroke="#9AC5FF" stroke-width="4"/>
  </g>

  <!-- Plotter body -->
  <g transform="translate(780 680)">
    <rect x="0" y="0" width="980" height="190" rx="30" fill="#0A1734"/>
    <rect x="40" y="35" width="900" height="80" rx="16" fill="#1D3B6A"/>
    <circle cx="120" cy="140" r="16" fill="#6ED2FF"/>
    <circle cx="170" cy="140" r="16" fill="#FF9F55"/>
    <circle cx="220" cy="140" r="16" fill="#7CFFB1"/>
  </g>

  <!-- Paper roll -->
  <g transform="translate(920 560)">
    <rect x="0" y="0" width="640" height="140" rx="18" fill="#E8F0FF"/>
    <rect x="30" y="20" width="580" height="100" rx="14" fill="#FFFFFF"/>
    <path d="M60 55H580M60 85H580" stroke="#B7C7E8" stroke-width="6"/>
  </g>
</svg>
